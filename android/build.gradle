buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "26.3.11579264"
        kotlinVersion = "1.9.25"
        agpVersion = "8.5.2"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:${agpVersion}")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

/**
 * SOLUTION: Force all C++ modules to see our patched headers in node_modules
 * This fixes the std::format error on VPS environments with incomplete C++20 support.
 */
allprojects {
    tasks.withType(com.android.build.gradle.tasks.ExternalNativeBuildTask).configureEach {
        it.doFirst {
            it.arguments.add("-DCMAKE_CXX_FLAGS=-I${rootDir}/../node_modules/react-native/ReactCommon -I${rootDir}/../node_modules/react-native/ReactAndroid/src/main/jni")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
